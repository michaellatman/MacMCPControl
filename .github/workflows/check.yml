name: Check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
      - run: python3 -m unittest discover -s Tests/Release
      - run: bash scripts/build-app.sh
      - run: bash -n scripts/build.sh scripts/build-app.sh scripts/notarize.sh
